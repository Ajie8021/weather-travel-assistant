<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f5">
  <title>智能出行对话 · 慢游指南</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <script defer th:src="@{/js/chat.js}" src="/js/chat.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" th:href="@{/}" href="/"><span class="brand-mark" aria-hidden="true">W</span><span>慢游指南<small>WEATHER × TRAVEL</small></span></a>
    <a class="back-link" th:href="@{/}" href="/">← 返回原有查询</a>
  </header>
  <main class="chat-main">
    <section class="chat-intro">
      <p class="eyebrow">YOUR AI TRAVEL COMPANION</p>
      <h1>说说你想怎么出发。</h1>
      <p>可以查天气、生成单日计划，也可以继续告诉我想修改哪一段。</p>
    </section>
    <section class="chat-shell" aria-label="智能出行对话">
      <div class="chat-toolbar"><span><i class="online-dot"></i>天气与出行助手</span><span id="agent-status">等待你的消息</span></div>
      <div id="chat-messages" class="chat-messages" aria-live="polite">
        <article class="message assistant-message"><span class="message-avatar">W</span><div class="message-body"><p>你好！你可以说“查一下明天广州的天气”，或“帮我安排明天广州一日游，偏好美食”。</p></div></article>
      </div>
      <div id="result-area" class="chat-results" aria-live="polite"></div>
      <div class="suggestions" aria-label="快捷示例">
        <button type="button" data-prompt="查一下明天广州的天气">查天气</button>
        <button type="button" data-prompt="帮我安排明天广州一日游，偏好美食">生成美食计划</button>
        <button type="button" data-prompt="下午改成室内活动">修改下午安排</button>
      </div>
      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="chat-input">输入你的问题</label>
        <textarea id="chat-input" rows="1" maxlength="2000" placeholder="例如：周末杭州天气怎么样？帮我安排一天户外行程。" required></textarea>
        <button class="send-button" type="submit" aria-label="发送消息"><span aria-hidden="true">↑</span></button>
      </form>
      <p class="chat-footnote">天气由 Open-Meteo 提供。计划供出行参考，请以出发前最新预报为准。</p>
    </section>
  </main>
  <footer><span>慢一点，也能看见更多。</span><span>原有天气和计划页面仍可使用</span></footer>
</body>
</html>
