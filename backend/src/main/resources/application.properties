spring.application.name=wea-trav-assistant
agent.api-key=${OPENAI_API_KEY:}
agent.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
agent.model=${OPENAI_MODEL:gpt-4o-mini}
agent.mcp-endpoint=${MCP_ENDPOINT:}
agent.max-tool-calls=4
spring.ai.mcp.server.name=weather-tools
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true
