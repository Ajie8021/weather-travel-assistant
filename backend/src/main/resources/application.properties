spring.application.name=wea-trav-assistant
# DashScope provides an OpenAI-compatible Chat Completions API. Never put the key here.
agent.api-key=${DASHSCOPE_API_KEY:}
agent.base-url=${DASHSCOPE_BASE_URL:https://llm-435dp91na852pfx3.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
agent.model=${DASHSCOPE_MODEL:qwen3.7-plus}
agent.mcp-endpoint=${MCP_ENDPOINT:}
agent.max-tool-calls=8
# Amap Web Service configuration. The Key is supplied only through the deployment environment.
amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com}
amap.key=${AMAP_WEB_KEY:}
amap.timeout=${AMAP_TIMEOUT:5000}
spring.ai.mcp.server.name=weather-tools
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true

